<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-3705607423243971">
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <title>Image Cropper - Solstice Cartel</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" rel="stylesheet">
</head>

<body>


    <nav class="navbar">
        <div class="logo">
            <img src="favicon.png" alt="Solstice Cartel Logo" />
        </div>
        <div class="name">
            Solstice Cartel
        </div>
        <ul class="nav-links">
            <li><a href="https://solsticecartel.github.io/">Home</a></li>
            <li><a href="https://solsticecartel.github.io/Cristiano-Ronaldo/">Cristiano Ronaldo</a></li>
            <li><a href="https://solsticecartel.github.io/calculator/">Calculator</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Image Cropper</h1>

        <label for="upload-image">Choose Image</label>
        <input type="file" id="upload-image" accept="image/*">


        <div class="image-container">
            <img id="image-preview" alt="">
        </div>


        <button id="crop-btn" disabled>Crop Image</button>
        <a id="download-btn" href="#" download="cropped-image.png">Download Cropped Image</a>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>

    <script src="script.js"></script>
</body>

</html>
